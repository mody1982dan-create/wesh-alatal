  const app = document.getElementById('app');
  const STORAGE='wesh-al3atal-demo-v02';
  let best={}; try {best=JSON.parse(localStorage.getItem(STORAGE)||'{}')||{}} catch(e){best={}}
  let state={screen:'home',idx:0,score:100,used:[],log:[],selected:null,wrong:[],hint:false,feedback:''};
  function save(){try{localStorage.setItem(STORAGE,JSON.stringify(best))}catch(e){}}
  function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function goTop(){try{window.scrollTo(0,0)}catch(err){document.documentElement.scrollTop=0;document.body.scrollTop=0}}
  function caseNum(i){return String(i+1).padStart(2,'0')}
  function home(){state.screen='home';render();goTop()}
  function start(i){state={screen:'game',idx:i,score:100,used:[],log:[],selected:null,wrong:[],hint:false,feedback:''};render();goTop()}
  function takeTest(i){if(state.screen!=='game')return;let c=cases[state.idx],t=c.tests[i];if(!t||state.used.includes(t.id))return;state.used.push(t.id);state.score=Math.max(0,state.score-t.cost);state.log.unshift({name:t.name,result:t.result});state.feedback='';render()}
  function pick(i){if(state.wrong.includes(i))return;state.selected=i;state.feedback='';render()}
  function diagnosis(){if(state.selected===null)return;let c=cases[state.idx];if(state.selected===c.correct){let curr=best[c.id]||0;best[c.id]=Math.max(curr,state.score);save();state.screen='done';render();goTop()}else{state.wrong.push(state.selected);state.score=Math.max(0,state.score-22);state.feedback='مو هو السبب المثبت في هذه الحالة. خذ فحص إضافي بدل التخمين؛ خُصمت 22 نقطة.';state.selected=null;render()}}
  function takeHint(){if(state.hint)return;state.hint=true;state.score=Math.max(0,state.score-12);render()}
  function homeMarkup(){let done=cases.filter(c=>Object.prototype.hasOwnProperty.call(best,c.id)).length;return `<section class="hero"><div class="container heroinner"><div><span class="eyebrow">⚡ لعبة التشخيص السعودي</span><h1>لا تغيّر القطعة...<br><b>اكتشف العطل.</b></h1><p>ادخل الورشة، افحص السيارة، اقرأ النتائج واختر السبب الصحيح. كل فحص له تكلفة نقاط؛ شطارتك أنك توصل للتشخيص بالدليل.</p><div class="actions"><button class="btn btn-primary" data-action="start" data-i="0">ابدأ أول قضية ←</button><button class="btn btn-ghost" data-action="scroll">شوف القضايا ↓</button></div></div><div class="hero-display" aria-hidden="true"><div class="display-top"><span>ENGINE DIAGNOSTICS</span><span>● LIVE</span></div><div class="display-reading">12.2 <span style="font-size:18px">V</span></div><div class="display-small">بطارية المركبة · جهد تحت الفحص</div><div class="meter"><div></div></div><div class="display-bottom"><span>نقاط التشخيص</span><span>100 / 100</span></div></div></div></section><main class="main" id="cases"><div class="container"><div class="section-top"><div><h2>اختر قضية من الورشة</h2><div class="muted small">ثلاث قضايا تدريبية قصيرة، تعمل بدون إنترنت</div></div><span class="progress-chip">أنجزت ${done} من 3</span></div><div class="casegrid">${cases.map((c,i)=>`<article class="casecard"><div class="caseicon" aria-hidden="true">${e(c.icon)}</div><span class="subhead">القضية ${caseNum(i)} · ${e(c.category)}</span><h3>${e(c.title)}</h3><p>${e(c.car)}</p><div class="foot"><div><span class="minitag">${e(c.level)}</span> <span class="minitag">${e(c.time)}</span>${best[c.id]!==undefined?`<div class="small" style="color:#147f79;margin-top:7px;font-weight:850">أفضل نتيجة: ${best[c.id]}/100</div>`:''}</div><button class="startcase" data-action="start" data-i="${i}">ابدأ القضية ←</button></div></article>`).join('')}</div><div class="alert">ℹ️ هذه لعبة تعليمية بقضايا افتراضية. نتائج الفحص ثابتة للتعلّم، ولا تُستخدم لتشخيص سيارة حقيقية أو كبديل عن مخططات وإجراءات الشركة الصانعة.</div><div class="trust"><strong>وش العطل؟ · الإصدار 0.2</strong> — نموذج أولي مجاني لا يطلب تسجيل دخول ولا صلاحية قراءة بيانات السيارة، ولا يرسل أي معلومات لخادم.</div></div></main>`}
  function gameMarkup(){let c=cases[state.idx];return `<main class="main"><div class="container"><div class="backline"><button class="textbtn" data-action="home">→ جميع القضايا</button><span class="breadcrumb">القضية ${caseNum(state.idx)} / ${cases.length}</span></div><div class="gameheader"><div><div class="case-num">${e(c.icon)} القضية ${caseNum(state.idx)} · ${e(c.category)}</div><h1>${e(c.title)}</h1><p>${e(c.car)}</p></div><div class="score" aria-live="polite"><div class="value">${state.score}</div><div class="caption">نقاطك</div></div></div><div class="gamegrid"><div class="panel"><div class="subhead">01 / بلاغ العميل</div><h2>وش المشكلة؟</h2><div class="symptoms">${e(c.report)}</div><div class="section-divider"></div><div class="subhead">02 / اختر الفحص</div><h2>استخرج الأدلة</h2><p class="muted small">كل فحص يخصم نقاطًا. الفحص الصحيح ليس بالضرورة الأغلى.</p><div class="testlist">${c.tests.map((t,i)=>{let did=state.used.includes(t.id);return `<button class="testbtn" data-action="test" data-i="${i}" ${did?'disabled':''}><span><span class="tname">${e(t.name)}</span><span class="tdesc" style="display:block">${e(t.desc)}</span></span><span class="price">${did?'✓ تم':`−${t.cost} نقطة`}</span></button>`}).join('')}</div></div><div><div class="panel"><div class="subhead">نتائج الفحوص</div><h2>دفتر الأدلة <span class="muted small">(${state.used.length}/${c.tests.length})</span></h2><div class="resultlist">${state.log.length?state.log.map((r,i)=>`<div class="logitem"><h3>${e(r.name)}</h3><p>${e(r.result)}</p></div>`).join(''):`<div class="emptyresults">🔎<div>لم تُجرِ أي فحص بعد.<br>اختر اختبارًا لتظهر نتيجته هنا.</div></div>`}</div></div><div class="panel diagpanel"><div class="subhead">03 / القرار النهائي</div><h2>وش السبب الأقرب حسب الأدلة؟</h2><p class="muted small">تقدر تخمّن الآن، لكن الخطأ يكلفك 22 نقطة.</p><div class="optiongrid">${c.options.map((op,i)=>`<button class="option ${state.selected===i?'active':''} ${state.wrong.includes(i)?'wrong':''}" data-action="pick" data-i="${i}" ${state.wrong.includes(i)?'disabled':''} aria-pressed="${state.selected===i}">${e(op)}</button>`).join('')}</div>${state.feedback?`<div class="feedback bad" role="status">${e(state.feedback)}</div>`:''}${state.hint?`<div class="hintbox">💡 ${e(c.hint)}</div>`:''}<div class="diagrow"><button class="hint" data-action="hint" ${state.hint?'disabled':''}>${state.hint?'✓ ظهرت التلميحة':'💡 تلميح (−12)'}</button><button class="btn btn-dark" data-action="diagnose" ${state.selected===null?'disabled':''}>اعتمد التشخيص ←</button></div></div></div></div><div class="trust">هذه محاكاة تعليمية ببيانات مفترضة؛ في الواقع تختلف الدوائر والقياسات حسب السيارة والموديل. لا تنفذ فحوص كهربائية أو وقود دون معدات واحتياطات مناسبة.</div></div></main>`}
  function doneMarkup(){let c=cases[state.idx],next=(state.idx+1)%cases.length;return `<main class="main"><div class="container finish"><div class="panel"><div class="finish-top"><div class="medal">${state.score>=75?'🏆':state.score>=50?'🥈':'🛠️'}</div><span class="subhead">قضية أُغلقت بنجاح</span><h1>عرفت العطل!</h1><div class="bigscore">${state.score}<span style="font-size:20px;color:#677b82"> / 100</span></div><p class="muted">${state.score>=75?'شغل مرتب! اختبارات قليلة وتشخيص صحيح.':state.score>=50?'تشخيص صحيح، لكن تقدر توفّر نقاط أكثر.':'وصلت للحل. أعد المحاولة وحاول تقلل الفحوص والتخمين.'}</p></div><div class="lessons"><h3>✅ السبب الصحيح: ${e(c.options[c.correct])}</h3><p>${e(c.why)}</p></div><div class="lessons" style="background:#fffaee;border-color:#f3dfb8"><h3>🧰 ملاحظة فنية مهمة</h3><p>${e(c.safe)}</p></div><div class="summaryrow"><div class="sumitem"><strong>${state.used.length}</strong><span>فحوص أجريتها</span></div><div class="sumitem"><strong>${state.wrong.length}</strong><span>تشخيصات خاطئة</span></div><div class="sumitem"><strong>${best[c.id]}</strong><span>أفضل نتيجة</span></div></div><div class="cta"><button class="btn btn-primary" data-action="start" data-i="${next}">${state.idx===cases.length-1?'العب قضية أخرى':'القضية التالية'} ←</button><button class="btn btn-secondary" data-action="start" data-i="${state.idx}">أعد المحاولة ↻</button><button class="btn btn-secondary" data-action="home">كل القضايا</button></div></div><div class="trust" style="text-align:center">كل نتيجة تحفظ على هذا الجهاز فقط عند توفر التخزين المحلي. لا توجد حسابات أو اتصالات خارجية.</div></div></main>`}
  function render(){app.innerHTML=state.screen==='home'?homeMarkup():state.screen==='game'?gameMarkup():doneMarkup()}
  document.addEventListener('click',ev=>{let target=ev.target.nodeType===1?ev.target:ev.target.parentElement;let btn=target && target.closest('[data-action]');if(!btn||btn.disabled)return;const act=btn.dataset.action,i=Number(btn.dataset.i);if(act==='start')start(i);if(act==='home')home();if(act==='test')takeTest(i);if(act==='pick')pick(i);if(act==='diagnose')diagnosis();if(act==='hint')takeHint();if(act==='scroll'){var dest=document.getElementById('cases');if(dest){try{dest.scrollIntoView({behavior:'smooth',block:'start'})}catch(err){dest.scrollIntoView()}}}});
  try { render(); } catch (err) { app.innerHTML='<main class="main"><div class="container"><div class="panel"><h2>تعذر تشغيل اللعبة</h2><p>افتح اللعبة في Safari من رابط HTTPS مباشر، وليس من معاينة تطبيق الملفات أو واتساب.</p></div></div></main>'; }
})();
</script>
</body>
</html>
