    /* Audio/settings controls: responsive and native inputs for iOS Safari */
    .head-actions{display:flex;align-items:center;gap:9px;flex-shrink:0}
    .settings-toggle{padding:8px 12px;border:1px solid #43596b;border-radius:12px;color:#f6f9fb;background:#223447;font-size:13px;font-weight:800;white-space:nowrap;min-height:40px}

    .settings-panel{max-width:650px;margin:0 auto}
    .settings-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:19px}
    .settings-header h1{margin:0;font-size:28px}
    .settings-row{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:19px 0}
    .settings-row:last-child{border-bottom:0}
    .settings-row h2{font-size:16px;margin:0 0 3px}
    .settings-row p{color:var(--muted);font-size:12px;margin:0}
    .settings-switch{min-width:84px;border-radius:30px;border:1px solid #ccd8df;background:#f5f7f9;color:#3d5464;padding:10px 12px;font-weight:850}
    .settings-switch[aria-pressed="true"]{background:#e4f6f2;border-color:#57a99c;color:#106f64}
    .settings-volume{width:100%;accent-color:#147f79;min-height:30px;touch-action:pan-x}
    .settings-volume:disabled{opacity:.4}
    .settings-meter{display:flex;align-items:center;gap:15px}
    .settings-meter label{white-space:nowrap;min-width:54px;font-weight:850;text-align:center;color:var(--teal)}
    .settings-preview{margin-top:15px;width:100%}
    .settings-note{font-size:12px;color:var(--muted);margin-top:15px;line-height:1.8}
    @media(max-width:430px){.version{display:none}.settings-toggle{padding:8px 10px;font-size:12px}.headinner{gap:6px}}


    /* Version 0.5 — local player, difficulty and cumulative rewards */
    .head-actions{flex-wrap:wrap;justify-content:flex-end;flex:1}
    .settings-toggle{font-size:12px;min-height:39px}
    .difficulty-wrap{background:#fff;border:1px solid #e0e7e9;border-radius:18px;padding:18px;margin:0 0 24px;box-shadow:0 8px 25px #132c3a0b}

    .difficulty-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
    .difficulty-btn{border:1px solid #cbd8dc;background:#fff;border-radius:13px;padding:11px 7px;min-height:60px;color:#344658;text-align:center;font-weight:900}
    .difficulty-btn span{display:block;font-size:11px;font-weight:500;color:#75838d;margin-top:2px}
    .difficulty-btn.active{border:2px solid #14867d;background:#e6f6f2;color:#086f66}
    .difficulty-selected{background:#e6f6f2;border:1px solid #b5e1d6;color:#126a62;display:inline-flex;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:800;margin-top:9px}
    .bonus-card{border:1px solid #e1e9e7;border-radius:15px;background:#f8fbfa;padding:14px;margin:15px 0}
    .bonus-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
    .bonus-metric{background:#fff;border:1px solid #dce5e7;border-radius:11px;text-align:center;padding:11px 7px}
    .bonus-metric strong{display:block;font-size:22px;color:#117b72}.bonus-metric span{font-size:11px;color:#536a72}
    .tinytag{display:inline-block;font-size:11px;background:#f2f5f7;padding:3px 8px;border-radius:8px;margin:2px}
    .proof-options{display:grid;gap:9px;margin:15px 0}.proof-option{text-align:right;background:#fff;border:1px solid #d2e1e3;border-radius:12px;padding:12px;min-height:52px;color:#253c47;font-weight:750}
    .proof-option.chosen{border:2px solid #13867c;background:#eaf9f4}
    .profile-panel{max-width:610px;margin:auto}.profile-field{width:100%;border:1px solid #beced1;border-radius:12px;padding:12px 13px;font:inherit;min-height:46px;margin:9px 0 14px}
    .profile-note{color:#6b7d86;font-size:12px;line-height:1.8}
    .results-list{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}
    .results-entry{border:1px solid #dfe5e7;border-radius:12px;padding:12px;background:#fff}
    .results-entry strong{display:block;color:#116e65;font-size:18px}
    .mini-celebrate{display:inline-block;animation:mini-pop .45s ease both}
    @keyframes mini-pop{0%{transform:scale(.85);opacity:.2}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
    .confetti{position:fixed;pointer-events:none;inset:0;overflow:hidden;z-index:9999;opacity:0;animation:confetti-layer .9s ease-out both}
    .confetti i{position:absolute;top:-20px;left:var(--x);width:6px;height:11px;border-radius:2px;background:var(--c);transform:rotate(var(--r));animation:confetti-fall .88s ease-in both;animation-delay:var(--delay)}
    @keyframes confetti-layer{0%{opacity:1}75%{opacity:1}100%{opacity:0}}
    @keyframes confetti-fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(90vh) rotate(540deg)}}
    @media(max-width:700px){.difficulty-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.head-actions{gap:5px}.settings-toggle{font-size:11px;padding:7px}.version{display:none}}
    @media(max-width:370px){.headinner{flex-wrap:wrap}.head-actions{width:100%;justify-content:space-between}.settings-toggle{padding:7px 9px}.results-list{grid-template-columns:1fr}}

 function upgradeIds(saved){if(!saved)return saved;
    if(saved.solved&&typeof saved.solved==='object'){for(const [oldId,newId] of Object.entries(idAliases)){if(saved.solved[oldId]){saved.solved[newId]=true;delete saved.solved[oldId]}}}

    return saved;
 }
 function initialProgress(name){const existing=get(key+'-progress:'+name,null);if(existing&&existing.solved)return upgradeIds(existing);
   const old=get('wesh-al3atal-v06-progress:'+name,null)||get('wesh-al3atal-progress-v05:'+name,null);let p={solved:{},best:{},legacyPoints:0};
   if(old&&old.solved){for(const [oid,done] of Object.entries(old.solved)){if(done&&(idx[idAliases[oid]||oid]))p.solved[idAliases[oid]||oid]=true}p.legacyPoints=Number(old.legacyPoints)||0}
    if(old&&old.done){for(const k of Object.keys(old.done)){const id=k.split(':').slice(1).join(':');if(old.done[k]&&idx[id])p.solved[idAliases[id]||id]=true}
     p.legacyPoints=Math.max(0,(Number(old.earned)||0)-Object.keys(p.solved).length*20);
   }
   set(key+'-progress:'+name,p);return p;
 }

 function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=randint(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
 function select(pool,n,avoid){let fav=shuffle(pool.filter(q=>!avoid.includes(q.id))),other=shuffle(pool.filter(q=>avoid.includes(q.id)));return fav.concat(other).slice(0,n)}
 function draw(mode){const previous=Array.isArray(recent[mode])?recent[mode]:[];let chosen=[];
   if(mode==='mixed'){for(const [lv,n] of Object.entries(QUOTA))chosen.push(...select(bank.filter(q=>q.level===lv),n,previous))}
   else chosen=select(bank.filter(q=>q.level===mode),25,previous);

 }

 function sound(kind){if(!settings.sound||settings.volume<=0)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended'){let promise=audioCtx.resume();if(promise&&typeof promise.catch==='function')promise.catch(()=>{})}
   const clips={tap:[[460,0,.045]],test:[[340,0,.065],[510,.09,.09]],correct:[[515,0,.09],[650,.10,.11],[784,.25,.17]],wrong:[[260,0,.15],[185,.14,.14]],win:[[520,0,.10],[659,.13,.10],[784,.27,.13],[1047,.42,.21]],milestone:[[520,0,.10],[659,.12,.10],[784,.25,.12],[1047,.38,.16],[1318,.57,.17]]};

   }
  }catch(e){}
 }

 function settingsScreen(){return `<main class="main"><div class="container modal-col"><div class="settings-header"><h1>⚙ الإعدادات</h1><button class="btn btn-secondary" data-act="back">رجوع</button></div><div class="panel"><div class="controlrow"><div><h3>🔊 المؤثرات الصوتية</h3><p>الأصوات مفعّلة افتراضيًا؛ يمكنك كتمها وقت ما تريد.</p></div><button class="toggle" aria-pressed="${settings.sound}" data-act="sound">${settings.sound?'مفتوح':'مكتوم'}</button></div><div class="controlrow"><div><h3>مستوى الصوت</h3><p>النغمات قصيرة وبدون أصوات بشرية.</p></div><span id="volLabel">${settings.volume}%</span></div><input class="settings-volume" type="range" min="0" max="100" value="${settings.volume}" id="volume" ${settings.sound?'':'disabled'}><div class="controlrow"><div><h3>اهتزاز خفيف</h3><p>عند الإجابة إذا كان الجهاز يدعمه.</p></div><button class="toggle" aria-pressed="${settings.vibration}" data-act="vibrate">${settings.vibration?'مشغّل':'موقوف'}</button></div><button class="btn btn-secondary settings-preview" data-act="preview">🔉 جرّب نغمة الفوز</button><p class="settings-note">على الآيفون يبدأ الصوت بعد أول ضغطة من اللاعب، بحسب سياسة سفاري وإعدادات الجهاز. الإعدادات تحفظ محليًا.</p></div></div></main>`}
 function profileScreen(){return `<main class="main"><div class="container modal-col"><div class="settings-header"><h1>👤 دخول اللاعب</h1><button class="btn btn-secondary" data-act="back">رجوع</button></div><div class="panel"><label for="playerName">اسم اللاعب على هذا الجهاز</label><input id="playerName" class="profile-field" maxlength="22" value="${safe(player==='ضيف'?'':player)}" placeholder="مثال: فني الديزل"><button class="btn btn-primary" data-act="save-profile">احفظ الاسم ←</button><p class="settings-note">دخول محلي بدون بريد أو كلمة مرور، ولكل اسم نتائج مستقلة على نفس الجهاز.</p></div></div></main>`}
 function resultsScreen(){let done=solvedCount(),miss=Math.max(0,10-done%10);return `<main class="main"><div class="container modal-col"><div class="settings-header"><h1>🏆 النتائج</h1><button class="btn btn-secondary" data-act="back">رجوع</button></div><div class="panel"><p>نتائج اللاعب: <strong>${safe(player)}</strong></p>${statusBar()}${progress.legacyPoints?`<p class="muted" style="font-size:12px">تتضمن حصيلتك ${progress.legacyPoints} نقطة إضافية محفوظة من إنجازات مستويات الإصدار السابق.</p>`:''}<h3>الإنجازات</h3><div class="lessons">${done>=10?`<p>🎉 أنجزت ${done} أعطال مختلفة، ورصيدك التراكمي ${lifetimePoints()} نقطة!</p>`:`<p>أجب عن ${miss} أعطال مختلفة إجابة صحيحة لتحقق أول إنجاز، وتختلف النقاط حسب فحوصك.</p>`}<div>${Array.from({length:Math.floor(done/10)},(_,i)=>`<span class="tag" style="margin:4px">🏅 ${(i+1)*10} أعطال منجزة</span>`).join('')}</div></div><h3>حسب مستوى العطل</h3><div class="statbar" style="grid-template-columns:repeat(2,minmax(0,1fr))">${Object.keys(LEVELS).map(k=>`<div class="stat"><strong>${bank.filter(x=>x.level===k&&progress.solved[x.id]).length}/${bank.filter(x=>x.level===k).length}</strong><small>${LEVELS[k]}</small></div>`).join('')}</div><div class="note">لكل عطل 20 نقطة كحد أقصى، ويُخصم من المكافأة نقطة عن كل فحص يُجرى. تُمنح النقاط المتبقية عند أول حل صحيح فقط، ولا تتكرر بإعادة العطل أو تغيير النمط.</div></div></div></main>`}
 function render(){let el=$('#app');el.innerHTML=view==='play'?play():view==='result'?result():view==='settings'?settingsScreen():view==='profile'?profileScreen():view==='results'?resultsScreen():home();}
 function returnHome(){view='home';previewMode=null;previewBank=[];render();top()}
 function answer(){let s=current(),q=question();if(!s||s.answered||s.choice===null)return;
   s.answered=true;s.right=s.options[s.choice]===q.correct;s.earned=s.right?Math.max(0,20-s.used.length):0;
   if(s.right){if(!progress.solved[q.id]){progress.solved[q.id]=true;progress.best=progress.best||{};progress.best[q.id]=s.earned;s.firstAward=true;s.milestone=solvedCount()%10===0?solvedCount():0}else{s.firstAward=false;s.milestone=0};storeProgress();sound(s.milestone?'milestone':'correct');buzz()}
   else{s.milestone=0;sound('wrong')}
   storeSession();render();
 }
 function next(){let s=current();if(!s||!s.answered)return;if(session.step===session.items.length-1){view='result';sound('win');}else{session.step++;view='play';sound('tap')}storeSession();render();top()}
 document.addEventListener('click',ev=>{
   const target=ev.target&&ev.target.nodeType===1?ev.target:ev.target&&ev.target.parentElement; const btn=target&&typeof target.closest==='function'?target.closest('[data-act]'):null;if(!btn||btn.disabled){if(difficultyMenuOpen&&!(target&&target.closest('.difficulty-wrap'))){difficultyMenuOpen=false;render()}return;}
   const action=btn.dataset.act;
   if(action==='difficulty-toggle'){difficultyMenuOpen=!difficultyMenuOpen;render();sound('tap');return}
    if(difficultyMenuOpen)difficultyMenuOpen=false;
    if(action==='mode'){saveMode(btn.dataset.v);return}
   if(action==='start'||action==='replay'){newSession();return}
   if(action==='start-case'){newSession(Number(btn.dataset.i));return}
   if(action==='reroll'){previewMode=null;previewBank=[];render();sound('tap');return}
   if(action==='scroll'){const panel=document.getElementById('cases');if(panel)panel.scrollIntoView({behavior:'smooth',block:'start'});sound('tap');return}
   if(action==='resume'){view='play';render();top();return}
   if(action==='home'){returnHome();sound('tap');return}
   if(['settings','profile','results'].includes(action)){if(!['settings','profile','results'].includes(view))back=view;view=action;render();top();sound('tap');return}
   if(action==='back'){view=back;render();top();sound('tap');return}
   if(action==='save-profile'){let field=$('#playerName');let name=field?field.value.trim().slice(0,22).replace(/[<>"']/g,'')||'ضيف':'ضيف';player=name;try{localStorage.setItem('wesh-al3atal-player-v05',name)}catch(e){};progress=initialProgress(name);session=get(key+'-session:'+name,null);view='home';render();top();sound('tap');return}
   if(action==='sound'){settings.sound=!settings.sound;set('wesh-al3atal-settings-v06',settings);render();if(settings.sound)sound('tap');return}
   if(action==='vibrate'){settings.vibration=!settings.vibration;set('wesh-al3atal-settings-v06',settings);render();sound('tap');return}
   if(action==='preview'){sound('win');return}
   if(view!=='play')return;
   let s=current(),q=question();if(!s||!q)return;
   if(action==='test'){let i=Number(btn.dataset.i);if(!s.answered&&!s.used.includes(i)&&q.tests[i]){s.used.push(i);storeSession();sound('test');render()}return}
   if(action==='choose'){let i=Number(btn.dataset.i);if(!s.answered&&s.options[i]){s.choice=i;sound('tap');storeSession();render()}return}
   if(action==='diagnose'){answer();return}
   if(action==='next'){next();return}
 });
 document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&difficultyMenuOpen){difficultyMenuOpen=false;render()}});
 document.addEventListener('input',ev=>{if(ev.target&&ev.target.id==='volume'){settings.volume=Number(ev.target.value);let label=$('#volLabel');if(label)label.textContent=settings.volume+'%';set('wesh-al3atal-settings-v06',settings)}});
 if(session && Array.isArray(session.items) && session.items.length>0 && session.step<session.items.length && session.items.every(x=>idx[x.id]) && session.items.every(x=>Array.isArray(x.options)&&x.options.length===4)){
  // Session is resumed intentionally from home, never automatically after page reload.
 }else session=null;
 render();
})();
</script></body></html>
